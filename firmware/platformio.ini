[platformio]
default_envs = nanoatmega328

[env]
test_framework = unity
build_flags =
    -Wall
    -Wextra
    -Wconversion
    -Wshadow
    -I include

[env:nanoatmega328]
platform = atmelavr@5.1.0
board = nanoatmega328
framework = arduino
; ELEGOO Nano (CH340) ships the new bootloader; the board default of 57600
; fails stk500 sync. Verified against device signature 0x1e950f on COM3.
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -D KEGPULSE_INTERNAL_PULLUP=1
    -D KEGPULSE_PULSE_EDGE=FALLING
    -D KEGPULSE_NOISE_GATE_US=0
    -D KEGPULSE_FLOW_GAP_MS=750
    -D KEGPULSE_SETTLING_MS=1500

[env:native]
platform = native@1.2.1
test_build_src = true
build_src_filter =
    +<protocol.cpp>
    +<session_machine.cpp>
build_flags =
    ${env.build_flags}
    -std=c++17
    -D UNITY_SUPPORT_64
