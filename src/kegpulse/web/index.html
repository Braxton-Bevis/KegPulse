<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#111315">
    <meta name="description" content="Local-first keg flow monitor">
    <title>KegPulse</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icons/kegpulse.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="app-header">
      <a class="brand" href="#/" aria-label="KegPulse home">
        <img src="/static/icons/kegpulse.svg" alt="" width="42" height="42">
        <span>KegPulse</span>
      </a>
      <div class="header-status" aria-live="polite" aria-atomic="true">
        <span id="connection-badge" class="badge neutral">● Starting</span>
        <span id="keg-battery" class="keg-battery hidden" role="img" aria-label="Keg level unavailable">
          <span class="keg-battery-body"><span class="keg-battery-fill"></span><span class="keg-battery-value">--%</span></span>
        </span>
        <span id="keg-summary">No keg configured</span>
      </div>
      <button id="menu-button" class="icon-button" type="button" aria-expanded="false" aria-controls="site-nav">
        <span aria-hidden="true">☰</span><span class="sr-only">Open navigation</span>
      </button>
      <nav id="site-nav" aria-label="Primary">
        <a href="#/">Home</a>
        <a href="#/history">History</a>
        <a href="#/keg">Keg</a>
        <a href="#/calibration">Calibration</a>
        <a href="#/participants">People</a>
        <a href="#/management">Management</a>
        <a href="#/settings">Device &amp; settings</a>
      </nav>
    </header>

    <div id="degraded-banner" class="banner warning hidden" role="status"></div>
    <main id="main" tabindex="-1">
      <div class="loading-card" role="status">Connecting to the local KegPulse service…</div>
    </main>

    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="toast" class="toast hidden" role="status"></div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title">Confirm action</h2>
        <p id="confirm-message"></p>
        <div class="button-row end">
          <button value="cancel" class="secondary">Keep current state</button>
          <button id="confirm-accept" value="confirm" class="danger">Confirm</button>
        </div>
      </form>
    </dialog>

    <dialog id="keypad-dialog" aria-labelledby="keypad-title">
      <h2 id="keypad-title">Enter administrator PIN</h2>
      <p id="keypad-dots" class="keypad-dots empty" aria-live="polite">Enter 4&ndash;20 digits</p>
      <div class="keypad-grid" role="group" aria-label="PIN keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="clear" aria-label="Clear">C</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="back" aria-label="Delete last digit">&#9003;</button>
      </div>
      <div class="button-row end">
        <button type="button" class="secondary" data-key="cancel">Cancel</button>
        <button type="button" id="keypad-ok" data-key="ok">OK</button>
      </div>
    </dialog>

    

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
