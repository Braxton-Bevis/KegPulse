name: package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            script: scripts/package-windows.ps1
          - os: ubuntu-22.04
            script: scripts/package-linux.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Windows source environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows.ps1 -Dev
      - name: Set up Linux source environment
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/setup-linux.sh --dev
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KegPulse-${{ runner.os }}-x64
          path: artifacts/*
